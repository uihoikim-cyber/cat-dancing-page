<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <!-- Body -->
  <ellipse cx="100" cy="150" rx="55" ry="50" fill="#F4A460"/>

  <!-- Head -->
  <circle cx="100" cy="85" r="45" fill="#F4A460"/>

  <!-- Left ear -->
  <polygon points="60,50 45,15 80,40" fill="#F4A460"/>
  <polygon points="63,48 52,22 76,42" fill="#FFB6C1"/>

  <!-- Right ear -->
  <polygon points="140,50 155,15 120,40" fill="#F4A460"/>
  <polygon points="137,48 148,22 124,42" fill="#FFB6C1"/>

  <!-- Face stripes -->
  <path d="M72,65 Q75,60 78,65" stroke="#C8874A" stroke-width="2" fill="none"/>
  <path d="M68,72 Q72,67 76,72" stroke="#C8874A" stroke-width="2" fill="none"/>
  <path d="M122,65 Q125,60 128,65" stroke="#C8874A" stroke-width="2" fill="none"/>
  <path d="M124,72 Q128,67 132,72" stroke="#C8874A" stroke-width="2" fill="none"/>

  <!-- Eyes -->
  <ellipse cx="82" cy="78" rx="10" ry="11" fill="white"/>
  <ellipse cx="118" cy="78" rx="10" ry="11" fill="white"/>
  <ellipse cx="84" cy="79" rx="6" ry="8" fill="#2D5A1B"/>
  <ellipse cx="120" cy="79" rx="6" ry="8" fill="#2D5A1B"/>
  <circle cx="85" cy="77" r="3" fill="black"/>
  <circle cx="121" cy="77" r="3" fill="black"/>
  <circle cx="87" cy="75" r="1.5" fill="white"/>
  <circle cx="123" cy="75" r="1.5" fill="white"/>

  <!-- Nose -->
  <polygon points="100,93 96,98 104,98" fill="#FF9999"/>

  <!-- Mouth -->
  <path d="M96,98 Q100,104 104,98" stroke="#C8874A" stroke-width="1.5" fill="none"/>
  <path d="M96,98 Q90,106 85,102" stroke="#C8874A" stroke-width="1.5" fill="none"/>
  <path d="M104,98 Q110,106 115,102" stroke="#C8874A" stroke-width="1.5" fill="none"/>

  <!-- Whiskers left -->
  <line x1="60" y1="94" x2="90" y2="97" stroke="#888" stroke-width="1.5"/>
  <line x1="58" y1="100" x2="90" y2="100" stroke="#888" stroke-width="1.5"/>
  <line x1="60" y1="106" x2="90" y2="103" stroke="#888" stroke-width="1.5"/>

  <!-- Whiskers right -->
  <line x1="140" y1="94" x2="110" y2="97" stroke="#888" stroke-width="1.5"/>
  <line x1="142" y1="100" x2="110" y2="100" stroke="#888" stroke-width="1.5"/>
  <line x1="140" y1="106" x2="110" y2="103" stroke="#888" stroke-width="1.5"/>

  <!-- Belly -->
  <ellipse cx="100" cy="158" rx="30" ry="28" fill="#FDE8C8"/>

  <!-- Left arm -->
  <ellipse cx="52" cy="148" rx="14" ry="22" fill="#F4A460" transform="rotate(-20, 52, 148)"/>
  <circle cx="44" cy="168" r="10" fill="#F4A460"/>
  <!-- Left paw toes -->
  <circle cx="38" cy="175" r="5" fill="#F4A460"/>
  <circle cx="44" cy="178" r="5" fill="#F4A460"/>
  <circle cx="51" cy="176" r="5" fill="#F4A460"/>

  <!-- Right arm -->
  <ellipse cx="148" cy="148" rx="14" ry="22" fill="#F4A460" transform="rotate(20, 148, 148)"/>
  <circle cx="156" cy="168" r="10" fill="#F4A460"/>
  <!-- Right paw toes -->
  <circle cx="149" cy="176" r="5" fill="#F4A460"/>
  <circle cx="156" cy="178" r="5" fill="#F4A460"/>
  <circle cx="162" cy="175" r="5" fill="#F4A460"/>

  <!-- Left leg -->
  <ellipse cx="75" cy="196" rx="16" ry="12" fill="#F4A460"/>
  <!-- Left foot toes -->
  <circle cx="60" cy="200" r="6" fill="#F4A460"/>
  <circle cx="70" cy="205" r="6" fill="#F4A460"/>
  <circle cx="81" cy="205" r="6" fill="#F4A460"/>

  <!-- Right leg -->
  <ellipse cx="125" cy="196" rx="16" ry="12" fill="#F4A460"/>
  <!-- Right foot toes -->
  <circle cx="119" cy="205" r="6" fill="#F4A460"/>
  <circle cx="130" cy="205" r="6" fill="#F4A460"/>
  <circle cx="140" cy="200" r="6" fill="#F4A460"/>

  <!-- Tail -->
  <path d="M145,175 Q185,160 175,130 Q165,110 155,125" stroke="#F4A460" stroke-width="14" fill="none" stroke-linecap="round"/>
  <circle cx="154" cy="124" r="8" fill="#F4A460"/>

  <!-- Blush -->
  <ellipse cx="68" cy="92" rx="10" ry="6" fill="#FFB6C1" opacity="0.6"/>
  <ellipse cx="132" cy="92" rx="10" ry="6" fill="#FFB6C1" opacity="0.6"/>

  <!-- Music notes -->
  <text x="20" y="40" font-size="18" fill="#FF69B4" opacity="0.8">♪</text>
  <text x="160" y="35" font-size="22" fill="#9B59B6" opacity="0.8">♫</text>
  <text x="170" y="70" font-size="16" fill="#3498DB" opacity="0.8">♩</text>
</svg>
